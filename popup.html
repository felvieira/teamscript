<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #18181f;
      --surface3: #1f1f28;
      --border: #1e1e2a;
      --border-hover: #2a2a3a;
      --text: #dcdce4;
      --text2: #6b6b80;
      --text3: #44445a;
      --accent: #6e56cf;
      --accent-soft: rgba(110,86,207,0.12);
      --accent-glow: rgba(110,86,207,0.25);
      --green: #30a46c;
      --green-soft: rgba(48,164,108,0.12);
      --red: #e5484d;
      --red-soft: rgba(229,72,77,0.1);
      --orange: #f76b15;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      width: 380px;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      padding: 14px 18px 12px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .brand-name {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .brand-tag {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
      background: var(--surface2);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    /* ── Content ── */
    .content { padding: 16px 18px 14px; }

    /* ── Status ── */
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 12px;
      color: var(--text2);
      transition: all 0.3s ease;
    }
    .status.is-active { border-color: var(--accent); background: var(--accent-soft); }
    .status.is-done { border-color: var(--green); background: var(--green-soft); color: var(--green); }
    .status.is-error { border-color: var(--red); background: var(--red-soft); color: var(--red); }

    .status-pip {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text3);
      flex-shrink: 0;
    }
    .status-pip.running { background: var(--orange); animation: blink 1.2s infinite; }
    .status-pip.done { background: var(--green); }
    .status-pip.error { background: var(--red); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* ── Progress ── */
    .track {
      height: 2px;
      background: var(--surface2);
      border-radius: 1px;
      margin-bottom: 14px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .track.on { opacity: 1; }
    .track-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 1px;
      transition: width 0.5s ease;
    }

    /* ── Primary action ── */
    .action-btn {
      width: 100%;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      position: relative;
      overflow: hidden;
    }
    .action-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent), #30a46c);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .action-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .action-btn:hover:not(:disabled)::before { opacity: 0.08; }
    .action-btn:active:not(:disabled) { transform: scale(0.985); }
    .action-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .action-btn span { position: relative; z-index: 1; }
    .action-btn .icon { font-size: 14px; }

    /* ── Results ── */
    .results { margin-top: 16px; }

    /* Stats row */
    .stats-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      text-align: center;
    }
    .stat-val {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .stat-lbl {
      font-size: 10px;
      color: var(--text3);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* Export buttons */
    .exports {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .exp-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 0;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: var(--sans);
      color: var(--text);
    }
    .exp-btn:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }
    .exp-btn:active { transform: scale(0.97); }
    .exp-ext {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      display: block;
      color: #fff;
    }
    .exp-desc {
      font-size: 9px;
      color: var(--text3);
      margin-top: 3px;
      display: block;
    }

    /* Search */
    .search-wrap {
      position: relative;
      margin-bottom: 10px;
    }
    .search-wrap input {
      width: 100%;
      height: 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 36px 0 34px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap input::placeholder { color: var(--text3); }
    .search-wrap .s-icon {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      color: var(--text3);
      pointer-events: none;
    }
    .search-wrap .s-count {
      position: absolute;
      right: 10px; top: 50%;
      transform: translateY(-50%);
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
    }

    /* Preview */
    .preview-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 170px;
      overflow-y: auto;
      padding: 10px 12px;
      font-size: 11px;
      line-height: 1.7;
      color: var(--text2);
      scrollbar-width: thin;
      scrollbar-color: var(--surface3) transparent;
    }
    .preview-box::-webkit-scrollbar { width: 4px; }
    .preview-box::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }
    .preview-box .p-line { padding: 1px 0; }
    .preview-box .p-time {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
    }
    .preview-box .p-who {
      color: var(--accent);
      font-weight: 600;
    }
    .preview-box .p-hl {
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 2px;
      padding: 0 2px;
    }

    /* Copy button */
    .copy-btn {
      width: 100%;
      height: 36px;
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text2);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .copy-btn:hover { border-color: var(--border-hover); color: var(--text); background: var(--surface2); }

    /* ── Utility ── */
    .hidden { display: none !important; }

    .footer {
      text-align: center;
      padding: 10px 18px;
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--text3);
      font-family: var(--mono);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">TS</div>
      <span class="brand-name">TeamScript</span>
    </div>
    <span class="brand-tag">v1.0</span>
  </div>

  <div class="content">
    <div class="status" id="statusCard">
      <div class="status-pip" id="pip"></div>
      <span id="statusText">Abra a transcrição no Teams e clique extrair</span>
    </div>

    <div class="track" id="track">
      <div class="track-fill" id="trackFill"></div>
    </div>

    <button class="action-btn" id="btnExtract">
      <span class="icon">↓</span>
      <span>Extrair Transcrição</span>
    </button>

    <div class="results hidden" id="resultsSection">
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-val" id="statEntries">0</div>
          <div class="stat-lbl">Entradas</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="statSpeakers">0</div>
          <div class="stat-lbl">Pessoas</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="statDuration">—</div>
          <div class="stat-lbl">Duração</div>
        </div>
      </div>

      <div class="exports">
        <button class="exp-btn" id="btnTxt"><span class="exp-ext">.txt</span><span class="exp-desc">Texto</span></button>
        <button class="exp-btn" id="btnMd"><span class="exp-ext">.md</span><span class="exp-desc">Markdown</span></button>
        <button class="exp-btn" id="btnSrt"><span class="exp-ext">.srt</span><span class="exp-desc">Legenda</span></button>
        <button class="exp-btn" id="btnJson"><span class="exp-ext">.json</span><span class="exp-desc">Dados</span></button>
      </div>

      <div class="search-wrap">
        <span class="s-icon">⌕</span>
        <input type="text" id="searchInput" placeholder="Buscar na transcrição..." />
        <span class="s-count hidden" id="searchCount"></span>
      </div>

      <div class="preview-box hidden" id="preview"></div>

      <button class="copy-btn" id="btnCopy">
        ⎘ Copiar tudo
      </button>
    </div>
  </div>

  <div class="footer">teams + transcript</div>
  <script src="popup.js"></script>
</body>
</html>
