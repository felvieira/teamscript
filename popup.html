<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #0c0c1d;
      --surface: #13132b;
      --surface2: #1a1a3a;
      --border: #252550;
      --text: #e8e8f0;
      --text2: #8888aa;
      --accent: #7c6aff;
      --accent2: #42d9a8;
      --gradient: linear-gradient(135deg, #7c6aff 0%, #42d9a8 100%);
      --danger: #ff5c6a;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      width: 360px;
      background: var(--bg);
      color: var(--text);
    }

    /* ── Header ── */
    .header {
      background: var(--gradient);
      padding: 18px 20px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      backdrop-filter: blur(4px);
    }
    .header-text h1 {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .header-text p {
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      margin-top: 1px;
    }
    .version {
      margin-left: auto;
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.12);
      padding: 2px 8px;
      border-radius: 20px;
    }

    /* ── Body ── */
    .body { padding: 16px; }

    /* ── Status ── */
    .status-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      transition: border-color 0.3s;
    }
    .status-card.active { border-color: var(--accent); }
    .status-card.success { border-color: var(--accent2); }
    .status-card.error { border-color: var(--danger); }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #555;
    }
    .dot.idle { background: #555; }
    .dot.running { background: #ff9800; animation: pulse 1s infinite; }
    .dot.done { background: var(--accent2); }
    .dot.error { background: var(--danger); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── Progress ── */
    .progress {
      height: 3px;
      background: var(--surface2);
      border-radius: 2px;
      margin-bottom: 14px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .progress.visible { opacity: 1; }
    .progress-bar {
      height: 100%;
      background: var(--gradient);
      border-radius: 2px;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* ── Buttons ── */
    .btn {
      width: 100%;
      padding: 11px 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn:active:not(:disabled) { transform: scale(0.98); }

    .btn-primary {
      background: var(--gradient);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 4px 20px rgba(124,106,255,0.4);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: var(--surface);
      color: var(--text2);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover:not(:disabled) { background: var(--surface2); color: var(--text); }

    /* ── Download grid ── */
    .download-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 12px;
    }
    .dl-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      color: var(--text);
    }
    .dl-btn:hover { background: var(--surface2); border-color: var(--accent); transform: translateY(-1px); }
    .dl-btn .dl-icon { font-size: 18px; display: block; margin-bottom: 4px; }
    .dl-btn .dl-label { font-size: 10px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── Search ── */
    .search-box {
      position: relative;
      margin-top: 12px;
    }
    .search-box input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 9px 12px 9px 34px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box input::placeholder { color: var(--text2); }
    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--text2);
      pointer-events: none;
    }
    .search-count {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      color: var(--text2);
    }

    /* ── Preview ── */
    .preview {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-top: 10px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 11.5px;
      line-height: 1.6;
      padding: 10px 12px;
      color: var(--text2);
      scrollbar-width: thin;
      scrollbar-color: var(--surface2) transparent;
    }
    .preview::-webkit-scrollbar { width: 5px; }
    .preview::-webkit-scrollbar-track { background: transparent; }
    .preview::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }
    .preview .line { padding: 2px 0; }
    .preview .speaker { color: var(--accent); font-weight: 600; }
    .preview .time { color: var(--text2); font-size: 10px; }
    .preview .highlight { background: rgba(124,106,255,0.3); border-radius: 2px; padding: 0 2px; }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .stat { text-align: center; }
    .stat-value { font-size: 16px; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 10px; color: var(--text2); margin-top: 1px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── Sections show/hide ── */
    .hidden { display: none !important; }

    /* ── Footer ── */
    .footer {
      text-align: center;
      padding: 8px;
      font-size: 10px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">📝</div>
    <div class="header-text">
      <h1>TeamScript</h1>
      <p>Teams + Transcript</p>
    </div>
    <span class="version">v1.0</span>
  </div>

  <div class="body">
    <div class="status-card" id="statusCard">
      <div class="dot idle" id="dot"></div>
      <span id="statusText">Clique em Extrair para capturar a transcrição</span>
    </div>

    <div class="progress" id="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <button class="btn btn-primary" id="btnExtract">
      <span>⚡</span> Extrair Transcrição
    </button>

    <!-- Post-extraction UI -->
    <div id="resultsSection" class="hidden">
      <div class="stats-bar">
        <div class="stat">
          <div class="stat-value" id="statEntries">0</div>
          <div class="stat-label">Entradas</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="statSpeakers">0</div>
          <div class="stat-label">Participantes</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="statDuration">—</div>
          <div class="stat-label">Duração</div>
        </div>
      </div>

      <div class="download-grid">
        <button class="dl-btn" id="btnTxt"><span class="dl-icon">📄</span><span class="dl-label">TXT</span></button>
        <button class="dl-btn" id="btnMd"><span class="dl-icon">📝</span><span class="dl-label">MD</span></button>
        <button class="dl-btn" id="btnSrt"><span class="dl-icon">🎬</span><span class="dl-label">SRT</span></button>
        <button class="dl-btn" id="btnJson"><span class="dl-icon">📦</span><span class="dl-label">JSON</span></button>
      </div>

      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Buscar na transcrição..." />
        <span class="search-count hidden" id="searchCount"></span>
      </div>

      <div class="preview hidden" id="preview"></div>

      <button class="btn btn-ghost" id="btnCopy" style="margin-top:10px">
        📋 Copiar tudo
      </button>
    </div>
  </div>

  <div class="footer">TeamScript &mdash; open source</div>
  <script src="popup.js"></script>
</body>
</html>
